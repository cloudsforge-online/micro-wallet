name: CI

# ────────────────────────────────────────────────────────────────────────────────────────────────
# The estate-wide half of this file is a CALL, not a copy. The 233 lines it replaces said so
# themselves: "THIS FILE IS TEMPORARY … deleted and replaced by a call to the shared reusable
# workflow". That workflow exists, so this is that deletion.
#
# WHAT THE COPY COST WHILE IT SURVIVED. service-ci.yml runs a step no bespoke file had: it derives
# every scope this service's route gates demand and fails if one is absent from the registry in
# @cloudsforge/contracts-auth. identity refuses to mint a token naming an unknown scope, so an
# unregistered scope is a service-to-service surface no identity-issued token can ever reach — and
# the suite stays green regardless, because it mints its own principals. wallet:read, wallet:write
# and wallet:money have been gating routes here with nothing checking any of the three, and
# wallet:money is the one in front of a withdrawal.
#
# The shared workflow also brings an image job that MIGRATES AND BOOTS the container and reads
# /livez. The old `docker` job built the image and inspected its metadata without ever running it.
#
# The `controls` job below is what the shared workflow does not cover, including the two image
# checks the old `docker` job did make.
# ────────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    # `release/**` builds too. A release branch carries the estate-wide version bump, and it
    # has to publish its images before testnet can be deployed from it — which is what proves
    # the release before anything is merged. Mainnet is unaffected: it pins a version tag.
    # `feat/**` builds too, for the same reason `release/**` does: a change that has to be proved
    # on testnet before it merges needs a published image to deploy, and the estate deploys images
    # rather than source. Mainnet is unaffected — it pins a version tag.
    branches: [main, 'release/**', 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: wallet
      database-env-var: WALLET_DATABASE_URL
      port: 4000
      # Match production rather than the workflow's default of 16: the estate's compose files pin
      # postgres:17-alpine, and a suite that passes on a version nobody runs proves nothing.
      postgres-version: '17'
      # The image smoke test boots the real service, and src/env.ts validates its configuration at
      # import — so the container needs the variables it declares, not just a database, or it exits
      # before it can serve /livez. The upstream URLs are never dialled because /livez needs no
      # upstream, and the challenge domain and URI are the SIWE binding — ci.test here, never a real
      # origin, because a challenge bound to a real domain could be replayed against it.
      #
      # `OUTBOX_SIGNING_SECRET=@generate` REPLACED `ci-only-not-a-real-secret-000000000000`, and the
      # comment that used to sit here said the secrets "only have to clear a length check". That was
      # the defect stated out loud in configuration: this service now runs @cloudsforge/secrets at
      # boot, which refuses a value that is not shaped like a generated secret, and the CI literal
      # is refused by the same rule that refuses the estate placeholder of micro-org #142.
      #
      # The answer is not a CI exemption — there is none, deliberately, because an escape hatch is
      # reached for in exactly the hurry that produced the defect. `@generate` is expanded by
      # service-ci.yml into a fresh `openssl rand -base64 48` per run and thrown away. CI does not
      # need a WEAK secret, it needs A secret: nothing in the smoke test verifies a signature
      # against anything else.
      #
      # `WALLET_SERVICE_TOKEN` is GONE rather than generated. It is the retired 600-second token,
      # this service only reports whether it is present, and setting it in CI made the smoke test
      # exercise a state no correct deployment should be in.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        OUTBOX_SIGNING_SECRET=@generate
        LEDGER_URL=http://127.0.0.1:4004
        CUSTODY_URL=http://127.0.0.1:4005
        INDEXER_URL=http://127.0.0.1:4006
        PRICING_URL=http://127.0.0.1:4007
        WALLET_CHALLENGE_DOMAIN=ci.test
        WALLET_CHALLENGE_URI=http://ci.test/verify
    secrets:
      # @cloudsforge/* resolves through link:../runtime and link:../contracts rather than a
      # registry, so the workflow checks out micro-runtime and micro-contracts as siblings. Both are
      # private, so it needs a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  controls:
    name: The controls this service exists to add
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: wallet }
      # Temporary, and for the same reason as the Dockerfile's two named build contexts: the runtime
      # and contracts packages are unpublished and resolve through link:.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-runtime
          path: runtime
          token: ${{ secrets.ESTATE_READ_TOKEN }}
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-contracts
          path: contracts
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      - name: 'Rule 7 — migrations are never run by the service process'
        working-directory: wallet
        run: |
          if grep -nE '\bmigrate\(' src/index.ts; then
            echo '::error::index.ts calls migrate — that is the migrator job, not the service'
            exit 1
          fi
          echo 'ok: the service process does not migrate'

      - name: 'Rule 8 — every background timer is a leased job'
        # The shared workflow bans setInterval. This repository bans setTimeout with it.
        working-directory: wallet
        run: |
          if grep -rnE '\bset(Interval|Timeout)\(' src/ --include='*.ts'; then
            echo '::error::a timer was found; background work is a leased job (@cloudsforge/jobs)'
            exit 1
          fi
          echo 'ok: no timers'

      # This service owns no balances. 04-domain-model §11: "No 'user balance' column anywhere
      # outside the ledger's projection. A cached balance in a product database is the bug that
      # made Crucible's bot state diverge from Pay's."
      - name: 'AD — no balance column anywhere in the schema'
        working-directory: wallet
        run: |
          if grep -nE '^\s+(balance|shards|last_seen|swept)\s+(numeric|bigint|text)' src/migrations.ts; then
            echo '::error::a running-total column was added; balances belong to the ledger'
            exit 1
          fi
          echo 'ok: no balance column'

      # contracts-chain is exact-pinned by wallet, settlement, custody and indexer. A caret there
      # is money credited at the wrong depth.
      - name: 'AD-02 — contracts-chain is never caret-ranged'
        working-directory: wallet
        run: |
          if grep -nE '"@cloudsforge/contracts-chain":\s*"\^' package.json; then
            echo '::error::contracts-chain must be exact-pinned, never caret-ranged'
            exit 1
          fi
          echo 'ok: contracts-chain is exact-pinned'

      # Confirmation depths, decimals and rate scale are read from contracts-chain and never
      # restated. A second declaration is the skew the exact pin exists to prevent.
      - name: 'AD — confirmation policy is read, never restated'
        working-directory: wallet
        run: |
          if grep -rnE '\b(confirmations|decimals)\s*[:=]\s*[0-9]+' src/ --include='*.ts' \
             | grep -vE '\.test\.ts|src/testsupport\.ts'; then
            echo '::error::a confirmation depth or decimals literal was declared; read contracts-chain'
            exit 1
          fi
          echo 'ok: confirmation policy is read, not restated'

      # The two image checks the shared workflow does not make. A job cannot see another job's
      # docker daemon, so the image is rebuilt here — against the same GHA cache the `estate` job's
      # image build writes.
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: wallet
          build-contexts: |
            runtimepkgs=runtime
            contractspkgs=contracts
          push: false
          load: true
          tags: wallet:hygiene
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 'The image must not run as root'
        # Read off the BUILT IMAGE rather than grepped out of the Dockerfile: a USER line in a stage
        # that is not the final one reads identically in the file and has no effect whatsoever.
        run: |
          user=$(docker image inspect wallet:hygiene --format '{{.Config.User}}')
          [ "$user" = "node" ] || { echo "::error::image runs as '${user:-root}'"; exit 1; }
          echo "ok: the image runs as ${user}"

      - name: 'The image must not carry a secret'
        # This service holds the credential that authorises a withdrawal. An ENV line would bake it
        # into the image and send it to every registry that mirrors it.
        run: |
          if docker image inspect wallet:hygiene --format '{{json .Config.Env}}' \
             | grep -iE 'secret|token|password|key'; then
            echo '::error::a secret-shaped value is baked into the image environment'
            exit 1
          fi
          echo 'ok: no secret-shaped value in the image environment'

  publish:
    needs: [estate, controls]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/'))
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The sibling checkouts the Dockerfile's named build contexts need; without a
      # contents:read token they 404 and the build fails at the first COPY --from.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
